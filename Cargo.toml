[package]
name = "cutline"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic, cache-aware context compaction for coding-agent requests to the Anthropic Messages API"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
